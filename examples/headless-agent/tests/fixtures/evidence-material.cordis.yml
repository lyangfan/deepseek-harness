# SPEC-02 real Loader Evidence material composition: the base app plus the material layer.
- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents: []
          workspaceContext: false
          dshHome: './.dsh-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'SPEC-02 real Loader Evidence material composition.'

- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: './.evidence-storage'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: evidence-core
  name: '@deepseek-ai/dsh-evidence-core'
  config:
    eligibleAgentPresetIds: [animalge-open-test]
    deterministicRunSelection:
      revision: spec-02-loader/v1
      exactToolNames: [bash]
    idleMergeMs: 0
    runnerEnabled: true
    runnerOutputRoot: .evidence-runner-outputs
    runnerDefaultTimeoutMs: 60000
